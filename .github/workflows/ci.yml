# The only CI (requirements §15): the same checks on every push to main and every PR, each one a command
# you can run locally. Agents only ever run on the replay runtime here: no API key, no spend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: kanbot
          POSTGRES_PASSWORD: kanbot
          POSTGRES_DB: kanbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanbot" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kanbot:kanbot@localhost:5432/kanbot
      KANBOT_RUNTIME: replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4; version from package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kanbot/web exec playwright install --with-deps chromium
      - name: Pull the images the tests run
        run: |
          for image in node:24-alpine python:3.12-alpine alpine/socat; do
            for attempt in 1 2 3; do
              docker pull -q "$image" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
          done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec knip --no-progress
      - name: Migrations match the schema
        run: |
          pnpm --filter @kanbot/shared exec drizzle-kit check
          pnpm --filter @kanbot/shared exec drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain packages/shared/drizzle)" ]; then
            echo "::error::schema.ts changed without a migration: run pnpm db:generate"
            git status --porcelain packages/shared/drizzle
            exit 1
          fi
      - run: pnpm test
      - run: pnpm eval:agents
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The deploy images (Dockerfile, docker-compose.yml) still build, so a broken one never reaches the server.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile app build
