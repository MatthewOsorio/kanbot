# Typecheck, lint, worker tests and e2e on every push and PR (requirements §15). Agents only ever
# run on the replay runtime here: no API key, no spend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: kanbot
          POSTGRES_PASSWORD: kanbot
          POSTGRES_DB: kanbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanbot" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kanbot:kanbot@localhost:5432/kanbot
      KANBOT_RUNTIME: replay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kanbot/web exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
