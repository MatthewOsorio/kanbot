# The only CI (requirements §15): the same checks on every push to main and every PR, each one a command
# you can run locally. Agents only ever run on the replay runtime here: no API key, no spend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: kanbot
          POSTGRES_PASSWORD: kanbot
          POSTGRES_DB: kanbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanbot" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kanbot:kanbot@localhost:5432/kanbot
      KANBOT_RUNTIME: replay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2 # on a PR, HEAD is the merge commit and HEAD^1 the base it merges into
      # What CI can't judge. An edited migration fails: the real database never re-runs one. The rest
      # are warnings for the owner's review and never fail.
      - name: Changes only the owner can judge
        if: github.event_name == 'pull_request'
        run: |
          edited=$(git diff --no-renames --name-only --diff-filter=MD HEAD^1 HEAD -- 'packages/shared/drizzle/*.sql')
          for f in $edited; do
            echo "::error file=$f::Migrations are append-only: add a new one with pnpm db:generate instead."
          done
          [ -z "$edited" ] || exit 1
          git diff --no-renames --name-status HEAD^1 HEAD | while read -r status path; do
            why=""
            case "$path" in
              .github/* | scripts/block-command.mts | *eslint.config.* | *tsconfig*.json | *vitest.config.* | *playwright.config.* | \
                .prettierignore | knip.json | pnpm-workspace.yaml | *repo-rules.test.ts | *test-network-guard.ts)
                why="changes the checks themselves" ;;
              */runtime/fence.ts | */runtime/redact.ts | apps/web/proxy.ts | apps/web/lib/auth.ts)
                why="security boundary" ;;
              agents/*.md | plugins/*)
                why="agent changed: run pnpm eval:agents (paid) before merging" ;;
              fixtures/runs/*)
                if [ "$status" != A ]; then why="changes an existing replay fixture"; fi ;;
              *.test.ts | *.spec.ts)
                if [ "$status" = D ]; then why="deletes a test file"; fi ;;
              package.json | */package.json)
                why="dependencies or scripts" ;;
            esac
            if [ -n "$why" ]; then
              echo "::warning file=$path::$why"
              if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then echo "### Changes only you can judge" >> "$GITHUB_STEP_SUMMARY"; fi
              echo "- \`$path\` ($status): $why" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version from package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kanbot/web exec playwright install --with-deps chromium
      - name: Pull the images the tests run
        run: |
          for image in node:24-alpine python:3.12-alpine alpine/socat; do
            for attempt in 1 2 3; do
              docker pull -q "$image" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
          done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec knip --no-progress
      - name: Migrations match the schema
        run: |
          pnpm --filter @kanbot/shared exec drizzle-kit check
          pnpm --filter @kanbot/shared exec drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain packages/shared/drizzle)" ]; then
            echo "::error::schema.ts changed without a migration: run pnpm db:generate"
            git status --porcelain packages/shared/drizzle
            exit 1
          fi
      - run: pnpm test
      - run: pnpm eval:agents
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The deploy images (Dockerfile, docker-compose.yml) still build, so a broken one never reaches the server.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose --profile app build
