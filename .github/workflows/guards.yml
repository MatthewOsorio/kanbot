# Catches a PR getting green by lowering the bar (requirements §15). pull_request_target runs this file and the
# guard script from the base branch, so a PR can't switch off its own guard. The PR is only ever read as
# data: never install from it or run anything from it here.
name: Guards

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Label events start overlapping runs: the newest must be the one whose result counts.
concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version from package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @kanbot/worker...
      - name: Fetch the PR's commits as data
        run: git fetch -q origin "refs/pull/$PR_NUMBER/head"
      - name: Guards
        run: pnpm --filter @kanbot/worker exec tsx src/ci-guards.ts
      - name: Secrets (all history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts="$HEAD_SHA" --redact --no-banner
      - name: Lint the PR's workflows
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          git archive "$HEAD_SHA" .github/workflows | tar -x -C "$RUNNER_TEMP/pr"
          git init -q "$RUNNER_TEMP/pr" # actionlint refuses a folder that isn't a git repo
          docker run --rm -v "$RUNNER_TEMP/pr:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
