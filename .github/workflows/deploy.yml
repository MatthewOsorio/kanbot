# Redeploys the server after CI passes on main (requirements §7, docs/deploy.md). Off until the repo
# variable KANBOT_DEPLOY is "on" and the DEPLOY_* secrets exist. Images are built on the server itself,
# so there is no registry to manage.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: >-
      vars.KANBOT_DEPLOY == 'on' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull, build and restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }} # private key for the server's kanbot user
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }} # `ssh-keyscan <host>` output, so the host is pinned
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "kanbot@$HOST" \
            "cd /srv/kanbot/app && git fetch -q origin main && git checkout -q --detach $SHA && docker compose up -d --build --remove-orphans"
