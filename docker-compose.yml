# M1 runs locally: only Postgres. web, worker and caddy are added for deployment in M4.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kanbot
      POSTGRES_PASSWORD: kanbot
      POSTGRES_DB: kanbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbot"]
      interval: 2s
      retries: 30

volumes:
  db-data:
