# Development: `docker compose up -d db`, only Postgres on 127.0.0.1.
# Running Kanbot (docs/deploy.md, requirements §7): profile `app` adds migrate, web (on 127.0.0.1) and worker;
# profile `public` adds caddy for HTTPS on a domain. Set COMPOSE_PROFILES=app (local, e.g. WSL) or app,public
# (server) in .env, then `docker compose up -d --build`. Everything runs on the host's rootless Docker daemon.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kanbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanbot}
      POSTGRES_DB: kanbot
    ports:
      # The worker uses host networking (below), so it reaches Postgres here. Never published publicly.
      - "127.0.0.1:${KANBOT_DB_PORT:-5432}:5432"
    volumes:
      # Named volumes live in rootless Docker's data-root, on the block-storage volume (docs/deploy.md).
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbot"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    profiles: [app]
    build: { context: ., target: web }
    image: kanbot-web
    working_dir: /app/packages/shared
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://kanbot:${POSTGRES_PASSWORD:-kanbot}@db:5432/kanbot
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [app]
    image: kanbot-web
    environment:
      DATABASE_URL: postgres://kanbot:${POSTGRES_PASSWORD:-kanbot}@db:5432/kanbot
      # Sign in with GitHub (§12): the session cookie's key, and the key the GitHub App's credentials are
      # encrypted with. Empty fails at sign-in with a message naming the variable.
      TZ: ${TZ:-UTC}
      KANBOT_SESSION_SECRET: ${KANBOT_SESSION_SECRET:-}
      KANBOT_ENCRYPTION_KEY: ${KANBOT_ENCRYPTION_KEY:-}
      # The repos belong to the worker's user; web runs as `node` and only reads them (diffs, settings).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    ports:
      # Loopback only: the browser on this machine (WSL forwards it to Windows), or Caddy on a server.
      - "127.0.0.1:${KANBOT_WEB_PORT:-3000}:3000"
    volumes:
      # Read-only: the web app checks repo paths and shows diffs; only the worker writes to repos.
      - ${KANBOT_REPOS_DIR:-/srv/kanbot/repos}:${KANBOT_REPOS_DIR:-/srv/kanbot/repos}:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    profiles: [app]
    build: { context: ., target: worker }
    # Only what the worker needs, never the whole .env: anything here reaches agents' host shells
    # (the worker strips DATABASE_URL and the API key from those itself).
    environment:
      DATABASE_URL: postgres://kanbot:${POSTGRES_PASSWORD:-kanbot}@127.0.0.1:${KANBOT_DB_PORT:-5432}/kanbot
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KANBOT_RUNTIME: ${KANBOT_RUNTIME:-sdk}
      # The daily cap resets at midnight in this zone (containers default to UTC).
      TZ: ${TZ:-UTC}
      # Projects with no image of their own run here, never in the worker's container, which holds the
      # Docker socket (§7).
      KANBOT_DEFAULT_IMAGE: ${KANBOT_DEFAULT_IMAGE:-node:24-bookworm}
    # Host networking: the QA app's container publishes its port on the host's 127.0.0.1 (§7), and the
    # worker must reach it there.
    network_mode: host
    # Root in the container is the unprivileged `kanbot` user on the host under rootless Docker, so the
    # socket, the repos and the files project containers write all have one owner (docs/deploy.md).
    user: "0:0"
    volumes:
      # The rootless daemon's socket: the worker starts project containers on the host's Docker.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Repos and worktrees at the same path as on the host, so `docker run -v <worktree>` resolves.
      - ${KANBOT_REPOS_DIR:-/srv/kanbot/repos}:${KANBOT_REPOS_DIR:-/srv/kanbot/repos}
      # Agent sessions (~/.claude) survive restarts, so Resume and bounce-backs can continue them.
      - worker-home:/root
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  caddy:
    profiles: [public]
    image: caddy:2
    environment:
      KANBOT_DOMAIN: ${KANBOT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  db-data:
  worker-home:
  caddy-data:
