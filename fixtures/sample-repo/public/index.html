<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todos</title>
  </head>
  <body>
    <h1>Todos</h1>
    <form id="add">
      <label for="title">New todo</label>
      <input id="title" name="title" required />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <script type="module">
      const list = document.getElementById("list");
      async function render() {
        const todos = await (await fetch("/api/todos")).json();
        list.replaceChildren(
          ...todos.map((t) => {
            const li = document.createElement("li");
            const box = document.createElement("input");
            box.type = "checkbox";
            box.checked = t.done;
            box.ariaLabel = t.title;
            box.onchange = async () => {
              await fetch(`/api/todos/${t.id}`, { method: "PATCH" });
              render();
            };
            li.append(box, ` ${t.title}`);
            return li;
          }),
        );
      }
      document.getElementById("add").onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById("title");
        await fetch("/api/todos", { method: "POST", body: JSON.stringify({ title: input.value }) });
        input.value = "";
        render();
      };
      render();
    </script>
  </body>
</html>
